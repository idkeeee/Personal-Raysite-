<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Make all relative links resolve from your repo root 
         ya gotta do this one cuz... git stuff idk... -->
        <base href="https://idkeeee.github.io/Personal-Raysite-/">

        <title> 🔥 </title>  
        <link rel="stylesheet" href="css/navbar.css?v=4">
        <link rel="stylesheet" href="css/sidebar.css?v=4">
        <link rel="stylesheet" href="css/general_styles.css?v=3">
        <link rel="stylesheet" href="css/cards.css?v=3">
        <link rel="stylesheet" href="css/cards/to_do_list.css?v=4">
    </head>

    <body>
        <!-- Navbar ⬆️ -->
         <nav class="navbar">
            <button class="hamburger" id="notificationMenuButton" type="button" onclick="toggleMenu()" aria-label="Open notification center">
                <span class="hamburger_icon" aria-hidden="true">&#9776;</span>
                <span class="notification_badge" id="notificationBadge" hidden>0</span>
            </button>
            <div class="ray_title"> <!-- the title is in navbar.css --></div>                 <!-- title -->
        </nav>

        <!-- Sidebar ⬅️ -->
         <aside class="side_menu" id="sideMenu" aria-hidden="true" aria-label="Notification center">
            <div class="side_menu_header">
                <div>
                    <p class="notification_eyebrow">TODAY</p>
                    <h2>Notification Center</h2>
                    <p id="notificationDateLabel" class="notification_date_label">Checking the calendar...</p>
                </div>
                <button class="side_menu-close-button" aria-label="Close notification center" onclick="toggleMenu()">×</button>
            </div>

            <div class="notification_toolbar">
                <span id="notificationSummary">Loading today’s tasks...</span>
                <button id="notificationRefreshButton" class="notification_refresh_button" type="button">Refresh</button>
            </div>

            <div id="notificationStatus" class="notification_status" role="status" aria-live="polite">
                Connecting to Calender...
            </div>

            <div id="notificationList" class="notification_list"></div>

            <a id="notificationCalendarLink" class="notification_calendar_link" href="html/cards/calender.html">
                Open Calender
                <span aria-hidden="true">→</span>
            </a>
        </aside>
        <div class="backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>   <!-- darkens page when sidemenu opens , in generals.js -->



        <section class="todo-wrap">

        <!-- Daily -->
        <article class="todo-card" data-slug="todo-daily">
        <header>
            <h2>Daily</h2>
            <button class="add-btn">+ Add</button>
        </header>
        <div class="table-wrap">
            <table class="todo-table">
            <thead>
                <tr><th></th><th>task</th><th>days</th><th>✓</th><th>⚡</th><th>✕</th></tr>
            </thead>
            <tbody></tbody>
            </table>
        </div>
        </article>

        <!-- Super-short-term tasks -->
        <article class="todo-card" data-slug="todo-super">
        <header>
            <h2>Super-short-term tasks</h2>
            <button class="add-btn">+ Add</button>
        </header>
        <div class="table-wrap">
            <table class="todo-table">
            <thead>
                <tr><th></th><th>task</th><th>days</th><th>⚡</th><th>✕</th></tr>
            </thead>
            <tbody></tbody>
            </table>
        </div>
        </article>


        <!-- Short-term -->

        </header>
        <div class="table-wrap">
            <table class="todo-table">
            <thead>
                <tr><th></th><th>task</th><th>days</th><th>⚡</th><th>✕</th></tr>
            </thead>
            <tbody></tbody>
            </table>
        </div>
        </article>
    
        <!-- Long-term -->
        <article class="todo-card" data-slug="todo-long">
        <header>
            <h2>Long-term</h2>
            <button class="add-btn">+ Add</button>
        </header>
        <div class="table-wrap">
            <table class="todo-table">
            <thead>
                <tr><th></th><th>task</th><th>days</th><th>⚡</th><th>✕</th></tr>
            </thead>
            <tbody></tbody>
            </table>
        </div>
        </article>



        <!-- School-related -->
        <article class="todo-card" data-slug="todo-school">
        <header>
            <h2>School-related</h2>
            <button class="add-btn">+ Add</button>
        </header>
        <div class="table-wrap">
            <table class="todo-table">
            <thead>
                <tr><th></th><th>task</th><th>days</th><th>⚡</th><th>✕</th></tr>
            </thead>
            <tbody></tbody>
            </table>
        </div>
        </article>



        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/cards/to_do.js?v=6"></script>
        <script src="js/generals.js"></script>
        <script src="js/navbar.js?v=3"></script>
    </body>

</html>
