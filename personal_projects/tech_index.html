<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tech Canvas</title>
  <link rel="stylesheet" href="tech_style.css" />
</head>
<body>
  <a class="home-button" href="../index.html" aria-label="Back to home">
    <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 10.8L12 3l9 7.8" />
      <path d="M5.5 9.5V21h13V9.5" />
      <path d="M9.5 21v-6h5v6" />
    </svg>
    <span>Home</span>
  </a>

  <canvas id="gridCanvas"></canvas>

  <div id="actionMenu" class="action-menu" hidden>
    <button id="addNewButton" type="button">Add New</button>
  </div>

  <div id="editPanel" class="edit-panel" hidden>
    <div class="edit-panel-header">
      <strong>Edit Block</strong>
      <button id="closeEditButton" type="button" aria-label="Close editor">×</button>
    </div>

    <label class="field">
      <span>Card Text</span>
      <input id="titleInput" type="text" placeholder="Block title" />
    </label>

    <label class="field">
      <span>Card Thumbnail</span>
      <input id="coverInput" type="file" accept="image/*" />
    </label>

    <div class="edit-actions">
      <button id="saveEditButton" type="button">Save</button>
      <button id="deleteBlockButton" type="button">Delete</button>
    </div>
  </div>

  <div id="subpage" class="subpage" aria-hidden="true">
    <button id="closeSubpageButton" class="subpage-close" type="button">Back</button>

    <section class="subpage-card">
      <div id="subpageCover" class="subpage-cover"></div>

      <div class="subpage-content">
        <div class="subpage-topline">
          <div class="title-wrap">
            <p class="subpage-kicker">Project Title</p>
            <h1
              id="subpageTitle"
              contenteditable="true"
              spellcheck="false"
              data-placeholder="Untitled"
            >Untitled</h1>
            <p id="autosaveStatus" class="autosave-status">Saved</p>
          </div>

          <label class="top-add-image">
            Add Images
            <input id="pageImageInput" type="file" accept="image/*" multiple />
          </label>
        </div>

        <div
          id="pageEditor"
          class="page-editor"
          contenteditable="true"
          spellcheck="true"
          data-placeholder="Type here. Paste screenshots with Ctrl + V."
        ></div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tech_grid.js"></script>
</body>
</html>
